[project]
name = "college-agent"
version = "0.1.0"
description = "MCP server that helps parents build a balanced college list with grounded data"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio", "respx"]

[project.scripts]
college-agent = "college_agent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
